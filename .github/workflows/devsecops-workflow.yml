name: DevSecOps Modern CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  devsecops:
    runs-on: ubuntu-latest
    
    env:
      DOCKER_IMAGE_TAG: ${{ github.sha }}

    steps:
      # ==========================================
      # 1. Preparación del Entorno
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Dummy Env Files
        run: |
          # Creamos archivos .env base para evitar errores de ruta
          echo "PORT=3001" > backend/users-service/.env
          echo "DB_HOST=localhost" >> backend/users-service/.env
          
          echo "PORT=3002" > backend/academic-service/.env
          echo "DB_HOST=localhost" >> backend/academic-service/.env
          
          echo "PORT=3000" > backend/api-gateway/.env
          echo "USERS_SERVICE_URL=http://users-service:3001" >> backend/api-gateway/.env
          echo "ACADEMIC_SERVICE_URL=http://academic-service:3002" >> backend/api-gateway/.env
          
          echo "VITE_API_URL=http://localhost:3000" > frontend/.env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================
      # 2. Instalación Reproducible y Calidad (Lint)
      # ==========================================
      - name: Install Dependencies & Lint
        run: |
          
          cd backend/users-service && npm ci && npx eslint@8 . --ext .js,.ts --fix-dry-run || echo "Linting skipped or failed in users-service"
          cd ../academic-service && npm ci && npx eslint@8 . --ext .js,.ts --fix-dry-run || echo "Linting skipped or failed in academic-service"
          cd ../api-gateway && npm ci && npx eslint@8 . --ext .js,.ts --fix-dry-run || echo "Linting skipped or failed in api-gateway"
          cd ../../frontend && npm ci && npx eslint@8 . --ext .js,.ts --fix-dry-run || echo "Linting skipped or failed in frontend"

      # ==========================================
      # 3. Testing Automático
      # ==========================================
      - name: Run Unit Tests
        run: |
          cd backend/users-service && npm test
          cd ../academic-service && npm test
          cd ../api-gateway && npm test
          cd ../../frontend && npm test

      # ==========================================
      # 4. Seguridad del Código (SAST)
      # ==========================================
      - name: SAST Scan (Semgrep)
        run: |
          python3 -m pip install semgrep
          semgrep --config=auto --error --exclude='node_modules'

      # ==========================================
      # 5. Build de Contenedores
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: |
          cd backend/api-gateway
          npm install --package-lock-only
          cd ..
          docker compose build
          docker tag users-service:latest users-service:${{ env.DOCKER_IMAGE_TAG }}
          docker tag academic-service:latest academic-service:${{ env.DOCKER_IMAGE_TAG }}
          docker tag api-gateway:latest api-gateway:${{ env.DOCKER_IMAGE_TAG }}

      # ==========================================
      # 6. Seguridad de Contenedores (SCA - Trivy)
      # ==========================================
      - name: Trivy scan API Gateway
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'api-gateway:${{ env.DOCKER_IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # ==========================================
      # 7. Smoke Test (Levantamiento y Verificación)
      # ==========================================
      - name: Deploy & Healthcheck
        run: |
          cd backend
          docker compose up -d
          sleep 20
          curl --fail http://localhost:3000/health || exit 1

      - name: Shutdown services
        if: always()
        run: |
          cd backend
          docker compose down