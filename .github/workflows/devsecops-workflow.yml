name: DevSecOps Modern CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  devsecops:
    runs-on: ubuntu-latest
    
    # Definición de variables de entorno para versionado de imágenes
    env:
      DOCKER_IMAGE_TAG: ${{ github.sha }}

    steps:
      # ==========================================
      # 1. Checkout & Setup (Instalación Reproducible)
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ==========================================
      # 2. Quality & Linting (Calidad de Código)
      # ==========================================
      - name: Install Dependencies & Lint
        run: |
          # Instalación reproducible con npm ci (falla si el lockfile no coincide)
          cd backend/users-service && npm ci && npx eslint .
          cd ../academic-service && npm ci && npx eslint .
          cd ../api-gateway && npm ci && npx eslint .
          cd ../../frontend && npm ci && npx eslint .

      # ==========================================
      # 3. Automated Testing
      # ==========================================
      - name: Run Unit Tests
        run: |
          cd backend/users-service && npm test
          cd ../academic-service && npm test
          cd ../api-gateway && npm test
          cd ../../frontend && npm test

      # ==========================================
      # 4. SAST (Seguridad del Código Estático)
      # ==========================================
      - name: SAST Scan (Semgrep)
        run: |
          python3 -m pip install semgrep
          # Escaneo de todo el monorepo buscando vulnerabilidades
          semgrep --config=auto --error --exclude='node_modules'

      # ==========================================
      # 5. Build de Contenedores (Versionado)
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: |
          # Usamos el SHA del commit como versión del artefacto
          docker compose -f backend/docker-compose.yml build
          docker tag users-service:latest users-service:${{ env.DOCKER_IMAGE_TAG }}
          docker tag academic-service:latest academic-service:${{ env.DOCKER_IMAGE_TAG }}
          docker tag api-gateway:latest api-gateway:${{ env.DOCKER_IMAGE_TAG }}

      # ==========================================
      # 6. SCA & Container Security (Trivy)
      # ==========================================
      - name: Container & Dependency Scan (Trivy)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'users-service:${{ env.DOCKER_IMAGE_TAG }}'
          format: 'table'
          exit-code: '1' # El pipeline falla si encuentra riesgos
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Repetir escaneo para servicios críticos si es necesario
      - name: Trivy scan API Gateway
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'api-gateway:${{ env.DOCKER_IMAGE_TAG }}'
          exit-code: '1'
          severity: 'CRITICAL'

      # ==========================================
      # 7. Smoke Test (Verificación Final)
      # ==========================================
      - name: Create .env for Smoke Test
        run: |
          echo "VITE_API_URL=http://localhost:3000" > frontend/.env
          # (Añadir aquí otros secrets necesarios para levantar el stack)

      - name: Deploy & Healthcheck
        run: |
          docker compose -f backend/docker-compose.yml up -d
          sleep 20
          curl --fail http://localhost:3000/health || exit 1

      - name: Cleanup
        if: always()
        run: docker compose -f backend/docker-compose.yml down